[project]
name = "neuro-paging"
version = "0.1.0"
description = "Context-aware adaptive memory for mobile agentic systems — Samsung ennovateX AX Hackathon 2026"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ajay Javali" },
    { name = "Christine R" },
]
keywords = ["agentic-memory", "on-device", "rag", "tiered-memory", "samsung-ennovatex"]

dependencies = [
    # Core retrieval
    "hnswlib>=0.8.0",
    "numpy>=1.26",
    "scipy>=1.11",
    # Pipeline orchestration
    "langgraph>=0.0.40",
    "langchain-core>=0.1.50",
    # Scheduling (background daemons)
    "apscheduler>=3.10",
    # Pattern mining & clustering
    "mlxtend>=0.23",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4",
    # Dashboard
    "streamlit>=1.30",
    "plotly>=5.18",
    # Utilities
    "pydantic>=2.5",
    "loguru>=0.7",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.17",
    "llama-cpp-python>=0.2.50",
    "transformers>=4.40",
    "tokenizers>=0.15",
    "huggingface_hub>=0.23",
]

ui = [
    "streamlit>=1.40",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.155.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipython>=8.20",
]

eval = [
    "datasets>=2.16",
    "rouge-score>=0.1.2",
]

build = [
    "pybind11>=2.11",
    "cmake>=3.27",
    "ninja>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_paging"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
timeout = 120
timeout_method = "thread"


